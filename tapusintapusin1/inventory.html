<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OJTBox | Asset Inventory CRUD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .inventory-container { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Modal Styles */
        .modal {
            display: none; 
            position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white; margin: 10% auto; padding: 20px;
            border-radius: 12px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-header { border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-save { background: #ff6600; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; }
        .status-badge.active { background: #e1f7e7; color: #28a745; padding: 4px 8px; border-radius: 4px; }
        .status-badge.inactive { background: #ffe5e5; color: #dc3545; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo"><a href="index.html" style="color: white; text-decoration: none; margin-right: 15px;"><i class="fa-solid fa-arrow-left"></i></a>OJTBox <span>| Inventory Manager</span></div>
        </div>
    </nav>

    <main class="inventory-container">
        <div class="header-flex">
            <h2>System Assets</h2>
            <button class="btn-add" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add New Asset</button>
        </div>

        <div id="inventory-data-wrapper">
            </div>
    </main>

    <div id="assetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Asset</h3>
                <span style="cursor:pointer" onclick="closeModal()">&times;</span>
            </div>
            <form id="assetForm">
                <input type="hidden" id="assetId"> <div class="form-group">
                    <label>Asset Name</label>
                    <input type="text" id="assetName" required>
                </div>
                <div class="form-group">
                    <label>Host Name</label>
                    <input type="text" id="hostName" required>
                </div>
                <div class="form-group">
                    <label>Serial Number</label>
                    <input type="text" id="serialNum" required>
                </div>
                <div class="form-group">
                    <label>Device Type</label>
                    <select id="deviceType">
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Server">Server</option>
                        <option value="Mobile">Mobile</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Save Asset</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('assetModal');
        const assetForm = document.getElementById('assetForm');

        // --- READ ---
        async function loadInventory() {
            const container = document.getElementById('inventory-data-wrapper');
            try {
                const response = await fetch('fetch_inventory.php');
                const data = await response.json();
                
                let tableHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Asset Name</th>
                                <th>Host Name</th>
                                <th>Serial Number</th>
                                <th>Device Type</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(item => `
                                <tr>
                                    <td>${item.asset_name}</td>
                                    <td>${item.host_name}</td>
                                    <td><code>${item.serial_num}</code></td>
                                    <td>${item.device_type}</td>
                                    <td><span class="status-badge ${item.status.toLowerCase()}">${item.status}</span></td>
                                    <td>
                                        <button onclick="editAsset(${JSON.stringify(item).replace(/"/g, '&quot;')})" style="color:#ff6600; background:none; border:none; cursor:pointer;"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button onclick="deleteAsset(${item.id})" style="color:red; background:none; border:none; cursor:pointer; margin-left:10px;"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`;
                container.innerHTML = tableHTML;
            } catch (err) { container.innerHTML = "<p>Error loading data.</p>"; }
        }

        // --- CREATE & UPDATE ---
// --- CREATE & UPDATE LOGIC ---
assetForm.onsubmit = async (e) => {
    e.preventDefault();
    
    const id = document.getElementById('assetId').value;
    
    // We add the "action" key here to tell the PHP what to do
    const payload = {
        action: id ? 'update' : 'create', 
        id: id,
        asset_name: document.getElementById('assetName').value,
        host_name: document.getElementById('hostName').value,
        serial_num: document.getElementById('serialNum').value,
        device_type: document.getElementById('deviceType').value,
        status: document.getElementById('status').value
    };

    const response = await fetch('inventory_api.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    const result = await response.json();
    if (result.success) {
        closeModal();
        loadInventory();
    } else {
        alert("Operation failed: " + result.message);
    }
};

// --- DELETE LOGIC ---
async function deleteAsset(id) {
    if (!confirm("Delete this asset?")) return;

    const response = await fetch('inventory_api.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id: id }) // Send action: delete
    });

    const result = await response.json();
    if (result.success) loadInventory();
}

        // --- MODAL HELPERS ---
        function openModal() {
            assetForm.reset();
            document.getElementById('assetId').value = "";
            document.getElementById('modalTitle').innerText = "Add New Asset";
            modal.style.display = "block";
        }

        function closeModal() { modal.style.display = "none"; }

        function editAsset(item) {
            document.getElementById('assetId').value = item.id;
            document.getElementById('assetName').value = item.asset_name;
            document.getElementById('hostName').value = item.host_name;
            document.getElementById('serialNum').value = item.serial_num;
            document.getElementById('deviceType').value = item.device_type;
            document.getElementById('status').value = item.status;
            document.getElementById('modalTitle').innerText = "Edit Asset";
            modal.style.display = "block";
        }

        window.onload = loadInventory;
    </script>
</body>
</html>
